schema = 1
project = "daukle/maven-test"
version = "1.0.0"

[modules]

[plugins]
maven = "./plugins"
demo = "./demo"

[toolchains.demo]

[toolchains.maven]
for = "demo"
coordinates = ["org.slf4j:slf4j-api:1.7.36"]

[[toolchains.maven.resolve]]
coordinates = ["org.opentest4j:opentest4j:1.3.0"]
into = ["modules", "tools/core", "classpath"]

[[toolchains.maven.resolve]]
coordinates = ["org.opentest4j:opentest4j:1.3.0"]
into = ["builds", "build-logic", "owner"]
