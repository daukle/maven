schema = 1
project = "daukle/maven-test"
version = "1.0.0"

[modules]

[plugins]
maven = "./plugins"
demo = "./demo"

[toolchains.demo]

# The shape a Gradle project needs: the classpath it compiles against comes
# from Central, and the plugins it applies come from the Plugin Portal, which
# serves a different set of coordinates. The Portal does mirror Central, so a
# small artifact is fetched from it here rather than the 37 MB plugin the real
# case uses; what this proves is the second repository and the second key.
[toolchains.maven]
for = "demo"
coordinates = ["org.slf4j:slf4j-api:1.7.36"]

[[toolchains.maven.resolve]]
repository = "https://plugins.gradle.org/m2"
coordinates = ["org.opentest4j:opentest4j:1.3.0"]
into = "pluginClasspath"
