schema = 1
project = "daukle/maven-test"
version = "1.0.0"

[modules]

[plugins]
maven = "./plugins"

# enforcedPlatform(jackson-bom:2.12.0) forces the direct 2.17.0 down to 2.12.0,
# as {strictly 2.12.0} does in Gradle (D-185 M3).
[toolchains.maven]
coordinates = ["com.fasterxml.jackson.core:jackson-databind:2.17.0"]
enforcedPlatforms = ["com.fasterxml.jackson:jackson-bom:2.12.0"]
